name: Daily Bestseller Crawl

on:
  schedule:
    # UTC 23:30 = 한국시간(KST) 오전 8:30
    # (밀리의서재가 자체적으로 그날 랭킹을 KST 오전 7:50경에 갱신하는 것을
    #  확인해서, 그보다 늦게 돌도록 여유를 두었다. 너무 이르면 전날과 똑같은
    #  스냅샷을 두 번 긁어서 "전일 대비 변동"이 항상 0으로 나오는 문제가 있었음)
    - cron: '30 23 * * *'
  workflow_dispatch: {}   # 저장소 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 패키지 설치
        run: |
          pip install -r crawler/requirements.txt
          playwright install --with-deps chromium

      - name: 크롤러 실행 (data.json / history.json / upcoming.json 생성)
        run: python crawler/crawl.py

      - name: 결과 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data.json history.json upcoming.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "chore: 구독 서비스 도서 베스트/공개예정 데이터 갱신 ($(date +'%Y-%m-%d'))"
          git push
